
##############################################
# Odatix settings for fmax synthesis
##############################################
---

# overwrite existing results
overwrite:        No   # overridden by -o / --overwrite

# prompt 'Continue? (Y/n)' after settings checks
ask_continue:     Yes  # overridden by -y / --noask

# exit monitor when all jobs are done
exit_when_done:   No   # overridden by -E / --exit

# size of the log history per job in the monitor
log_size_limit:   300  # overridden by --logsize

# maximum number of parallel jobs
nb_jobs:          10    # overridden by -j / --jobs

# targeted architectures
# A compact scalar sweep: 24 configs total, covering both pipeline-off and
# pipeline-on variants while staying within the 20-30 configuration target.

architectures:

  # - AsteRISC + Pipeline/P-IF1ID1EX1MA1WB1 + Baseline/* + MUL/* 
  # - AsteRISC + Pipeline/*
  # - AsteRISC + Baseline/* + MUL/* 

  # - CV32E40P/*

  # - CVA6/Base
  # - CVA6 + ISA/* + Cache/* 
  # - CVA6 + SB/*
  # - CVA6 + LoadBuff/*
  # - CVA6 + Pipeline/*
  # - CVA6 + PMP/*


  - AUBRAC + ISA/*
  - AUBRAC + Pipeline/*
  - AUBRAC + Frontend/*

  # - NEORV32 + ISA/*
  # - NEORV32 + BitManip/*
  # - NEORV32 + PMP/*
  # - NEORV32 + ISA/IM + MicroArch/*

  # - PICORV32 + ISA/* + MulDiv/* 
  # - PICORV32 + ISA/* + RegisterFile/*
  # - PICORV32 + ISA/* + Shifter/*
  # - PICORV32 + ISA/*



 

  
  # - Your_Design/*

