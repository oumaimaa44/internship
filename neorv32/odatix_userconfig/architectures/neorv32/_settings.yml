---
rtl_path: "rtl/core"

top_level_file: "neorv32_soc_top.vhd"
top_level_module: "neorv32_soc_top"

clock_signal: "clk_i"
reset_signal: "rstn_i"

file_copy_enable: No
file_copy_source: "/dev/null"
file_copy_dest: "/dev/null"

use_parameters: Yes
start_delimiter: "generic ("
stop_delimiter: ");"

xc7a100t-csg324-1:
   fmax_synthesis:
      lower_bound: 50
      upper_bound: 300
   custom_freq_synthesis:
      lower_bound: 100
      upper_bound: 300
      step: 100
...
